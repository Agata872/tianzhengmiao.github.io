<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="$name">
  <meta name="description" content="$description">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="website">
  <title>$title</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/source-serif-4-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css?v=4">
  $scripts
</head>
<body class="$body_class">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-name" href="index.html">$name</a>
      <div class="nav-links">$navigation</div>
    </nav>
  </header>
  <main id="main">$content</main>
  <footer class="site-footer">
    <p>© $year $name · <a href="mailto:$email">$email</a> · $location</p>
    <p>Last updated $updated · <a href="awards.html">Awards</a></p>
  </footer>
</body>
</html>
